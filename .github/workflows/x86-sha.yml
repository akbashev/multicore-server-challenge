# Not for upstream: swift-epoll-akbashev-sha (SHA-256 on the x86 SHA extensions) on an x86 runner: whether the CPU
# has them and the server picks them (its start-up check hashes test messages both ways), and the conformance tests
# on the 2% seed with them in use.
name: x86 sha
on:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash

jobs:
  sha:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:18
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 30
    env: { PGHOST: 127.0.0.1, PGPORT: 5432, PGUSER: postgres, PGPASSWORD: postgres }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: bench/go.mod, cache-dependency-path: bench/go.sum }
      - name: machine
        run: |
          lscpu | grep -E "Model name|^CPU\(s\)"
          echo "SHA extensions: $(grep -o -m1 -w sha_ni /proc/cpuinfo || echo none)"
      - name: tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client curl jq
      - name: seed
        run: bash seed/make-seed.sh --dev
      - name: install.sh
        run: sudo bash submissions/swift-epoll-akbashev-sha/install.sh > /tmp/install.log 2>&1 || { tail -30 /tmp/install.log; exit 1; }
      - name: build, start, test
        run: bash test/run.sh submissions/swift-epoll-akbashev-sha
      - name: start-up line
        run: |
          DATABASE_URL=postgres://conduit:conduit@127.0.0.1:5432/conduit_dev JWT_SECRET=x PORT=3999 timeout 10 \
            submissions/swift-epoll-akbashev-sha/.build/release/Conduit 2>&1 | grep listening || true
          objdump -d submissions/swift-epoll-akbashev-sha/.build/release/Conduit | grep -c sha256rnds2
