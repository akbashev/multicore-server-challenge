# Not for upstream: million's gzip at 68b7dc9 and the new one (gzbench/mu-patch: one pass on ISA-L's default table, the
# CRC on the carry-less multiply; also timed with the table CRC) against ISA-L 2.31.1 at level 0 (as
# swift-iouring-Tabonx calls it), libdeflate level 1 and zlib level 1, on feeds the server sends under the load
# generator's kind of posts; time per feed on one pinned CPU, sizes, a check that each output decompresses, and perf.
name: x86 gzip
on:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash

jobs:
  gzip:
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2, 3]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:18
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env: { PGHOST: 127.0.0.1, PGPORT: 5432, PGUSER: postgres, PGPASSWORD: postgres, JWT_SECRET: million-users-challenge }
    steps:
      - uses: actions/checkout@v4
        with: { path: patch }
      - uses: actions/checkout@v4
        with:
          repository: akbashev/million-users-challenge
          ref: 68b7dc9ec39bec57bb5c1e8408ba398eab3e56c7
          path: million
      - name: machine
        run: |
          lscpu | grep -E "Model name|^CPU\(s\)"
          echo "avx512f: $(grep -c -m1 -w avx512f /proc/cpuinfo), vpclmulqdq: $(grep -c -m1 -w vpclmulqdq /proc/cpuinfo)"
      - name: tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client jq curl openssl nasm libdeflate-dev zlib1g-dev
          sudo apt-get install -y -qq linux-tools-common "linux-tools-$(uname -r)" || sudo apt-get install -y -qq linux-tools-generic
          sudo sysctl -q kernel.perf_event_paranoid=-1 kernel.kptr_restrict=0
      - name: apply the new gzip (the old one kept for timing)
        working-directory: million
        run: |
          D=submissions/swift-epoll-akbashev
          cp $D/Sources/Gzip/Gzip.swift /tmp/GzipOld.swift
          cp ../patch/gzbench/mu-patch/Package.swift $D/
          cp ../patch/gzbench/mu-patch/Sources/Gzip/Gzip.swift $D/Sources/Gzip/
          mkdir -p $D/Sources/CRCExtensions $D/Sources/CRCExtensions512
          cp ../patch/gzbench/mu-patch/Sources/CRCExtensions/CRCExtensions.swift $D/Sources/CRCExtensions/
          cp ../patch/gzbench/mu-patch/Sources/CRCExtensions512/CRCExtensions512.swift $D/Sources/CRCExtensions512/
          cp ../patch/gzbench/mu-patch/Sources/Feed/Feed.swift $D/Sources/Feed/
          git status --short
      - name: seed, and the server
        working-directory: million
        run: |
          psql -qX -d postgres -c "ALTER SYSTEM SET max_connections = 600"
          docker restart "$(docker ps -q --filter ancestor=postgres:18)"
          until pg_isready -q; do sleep 1; done
          bash seed/make-seed.sh > /tmp/seed.log 2>&1
          sudo bash submissions/swift-epoll-akbashev/install.sh > /tmp/install.log 2>&1
          bash submissions/swift-epoll-akbashev/build.sh 2>&1 | tail -1
      - name: million's tests, with the new gzip
        working-directory: million
        run: bash test/run.sh submissions/swift-epoll-akbashev 2>&1 | tail -3
      - name: feeds
        working-directory: million
        run: |
          psql -qX -d postgres -c "DROP DATABASE IF EXISTS feed_test WITH (FORCE)" -c "CREATE DATABASE feed_test TEMPLATE feed_seed"
          DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5432/feed_test HOST=127.0.0.1 PORT=3000 EXTRA_PORT=3001 \
            submissions/swift-epoll-akbashev/.build/release/Feed > /tmp/server.log 2>&1 &
          for _ in $(seq 60); do curl -sf -o /dev/null http://127.0.0.1:3000/health && break; sleep 1; done
          python3 ../patch/gzbench/feeds.py /tmp/feeds 300
          # Through the server: each gzipped feed against the same feed plain (no post in between).
          ok=0; for k in $(seq 50); do
            curl -s -H 'Accept-Encoding: gzip' -D /tmp/h -o /tmp/f.gz http://127.0.0.1:3000/feed
            curl -s -o /tmp/f.json http://127.0.0.1:3000/feed
            grep -qi '^content-encoding: gzip' /tmp/h && gzip -t /tmp/f.gz && gunzip -c /tmp/f.gz | cmp -s - /tmp/f.json && ok=$((ok + 1))
          done; echo "gzipped by the server and equal to the plain feed: $ok/50"
          kill %1
          grep -o 'SHA-256.*' /tmp/server.log || true
      - name: ISA-L 2.31.1, as swift-iouring-Tabonx builds it
        run: |
          curl -fsSL -o /tmp/isa-l.tar.gz https://github.com/intel/isa-l/archive/refs/tags/v2.31.1.tar.gz
          echo "e1d5573a4019738243b568ab1e1422e6ab7557c5cae33cc8686944d327ad6bb4  /tmp/isa-l.tar.gz" | sha256sum -c -
          tar xzf /tmp/isa-l.tar.gz -C /tmp && make -s -C /tmp/isa-l-2.31.1 -f Makefile.unx -j"$(nproc)" lib > /dev/null
          gcc -O2 -I/tmp/isa-l-2.31.1/include -o /tmp/cbench patch/gzbench/cbench.c /tmp/isa-l-2.31.1/bin/isa-l.a -ldeflate -lz
      - name: ours, with million's flags
        run: |
          export PATH=/opt/swift/usr/bin:$PATH
          CPU=$(clang -march=native -### -c -x c /dev/null 2>&1 | grep -o '"-target-cpu" "[^"]*"' | cut -d'"' -f4)
          echo "target-cpu $CPU"
          D=million/submissions/swift-epoll-akbashev
          for v in old step3 new; do
            cp -R patch/gzbench/swift /tmp/sbench-$v
            mkdir -p /tmp/sbench-$v/Sources/Gzip
            if [ $v = old ]; then cp /tmp/GzipOld.swift /tmp/sbench-$v/Sources/Gzip/Gzip.swift
            else
              cp patch/gzbench/swift/Package-new.swift /tmp/sbench-$v/Package.swift
              cp -R $D/Sources/Syscalls $D/Sources/CRCExtensions $D/Sources/CRCExtensions512 /tmp/sbench-$v/Sources/
              cp $D/Sources/Gzip/Gzip.swift /tmp/sbench-$v/Sources/Gzip/
            fi
            # "step3": one position per step, and its 4-lane CRC.
            if [ $v = step3 ]; then cp patch/gzbench/step3/Gzip.swift /tmp/sbench-$v/Sources/Gzip/Gzip.swift
              cp patch/gzbench/step3/CRCExtensions.swift /tmp/sbench-$v/Sources/CRCExtensions/; fi
            (cd /tmp/sbench-$v && swift build -c release -Xswiftc -enforce-exclusivity=unchecked --static-swift-stdlib \
              -Xswiftc -target-cpu -Xswiftc "$CPU" 2>&1 | tail -1)
          done
      - name: time per feed (one pinned CPU), sizes, check
        run: |
          mkdir -p /tmp/out
          for round in 1 2; do
            echo "== round $round"
            taskset -c 1 /tmp/sbench-old/.build/release/sbench /tmp/feeds 300 400 /tmp/out swift-old
            taskset -c 1 /tmp/sbench-step3/.build/release/sbench /tmp/feeds 300 400 /tmp/out swift-step3
            taskset -c 1 /tmp/sbench-new/.build/release/sbench /tmp/feeds 300 400 /tmp/out swift-new
            taskset -c 1 /tmp/cbench /tmp/feeds 300 400 /tmp/out
          done
          python3 patch/gzbench/verify.py /tmp/feeds /tmp/out 300
      - name: the CRC folds
        run: |
          export PATH=/opt/swift/usr/bin:$PATH
          cp -R patch/gzbench/crccheck /tmp/crccheck
          cp -R million/submissions/swift-epoll-akbashev/Sources/CRCExtensions million/submissions/swift-epoll-akbashev/Sources/CRCExtensions512 /tmp/crccheck/Sources/
          (cd /tmp/crccheck && swift build -c release 2>&1 | tail -1)
          taskset -c 1 /tmp/crccheck/.build/release/crccheck $(grep -q -w vpclmulqdq /proc/cpuinfo && grep -q -w avx512f /proc/cpuinfo && echo 1 || echo 0)
      - name: perf, the new one and ISA-L
        run: |
          set +o pipefail
          demangle() { /opt/swift/usr/bin/swift-demangle --simplified; }
          perf record -q -F 4999 -o /tmp/s.data -- taskset -c 1 /tmp/sbench-new/.build/release/sbench /tmp/feeds 300 300 /tmp/out swift-new > /dev/null 2>&1
          echo "-- the new one"; perf report -i /tmp/s.data --stdio --no-children --sort symbol 2>/dev/null | grep -v '^#' | grep -v '^$' | head -6 | demangle | cut -c1-150
          echo "-- its hottest instructions"; perf annotate -i /tmp/s.data --stdio 2>/dev/null | grep -E '^ +[0-9]+\.[0-9]+ ' | sort -rn | head -40 | cut -c1-140
          perf record -q -F 4999 -o /tmp/c.data -- taskset -c 1 /tmp/cbench /tmp/feeds 300 300 /tmp/out > /dev/null 2>&1
          echo "-- cbench (all three)"; perf report -i /tmp/c.data --stdio --no-children --sort symbol 2>/dev/null | grep -v '^#' | grep -v '^$' | head -20 | cut -c1-150
