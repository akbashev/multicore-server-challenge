# Not for upstream: the swift-underlord package (notes/) tested on x86 and arm64 runners, with its X86Extensions
# trait and without, Swift installed by its own script; and its documentation site built.
name: x86 notes
on:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
    working-directory: notes

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Swift 6.4.2, through the install script
        run: sudo SWIFT_VERSION=6.4.2 bash scripts/install-swift.sh
      - name: the CPU
        run: |
          uname -r; lscpu | grep -E 'Model name'
          echo "features: $(grep -o -w -E 'sha_ni|pclmulqdq|avx512f|vpclmulqdq' /proc/cpuinfo | sort -u | xargs)"
      - name: test (debug)
        timeout-minutes: 15
        run: swift test 2>&1 | grep --line-buffered -E 'Test run with|✘|error:|Expectation|recorded|runs on|on extensions'
      - name: test (release)
        timeout-minutes: 15
        run: swift test -c release -Xswiftc -enable-testing 2>&1 | grep --line-buffered -E 'Test run with|✘|error:|Expectation|recorded|runs on|on extensions'
      - name: test (portable only)
        timeout-minutes: 15
        run: swift test --disable-default-traits 2>&1 | grep --line-buffered -E 'Test run with|✘|error:|Expectation|recorded'
      - name: each EventLoop test alone in release, three times
        timeout-minutes: 25
        run: |
          set +e
          for name in actorsRunOnTheLoopsThread interruptEndsAWaitBeforeOrDuring waitLastsUntilItsDeadline registeredDescriptorsWakeTheLoop messagesWakeWaitForEvents; do
            ok=0; hung=0; other=0
            for i in $(seq 3); do
              timeout 30 swift test -c release -Xswiftc -enable-testing --skip-build --filter "EventLoopTests.$name" > /tmp/out.txt 2>&1
              case $? in 0) ok=$((ok + 1)) ;; 124) hung=$((hung + 1)) ;; *) other=$((other + 1)); tail -5 /tmp/out.txt ;; esac
            done
            echo "RESULT release $name: $ok passed, $hung hung, $other failed"
          done

  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Swift 6.4.2 with DocC, through the install script
        run: sudo SWIFT_VERSION=6.4.2 SWIFT_FULL=1 bash scripts/install-swift.sh
      - name: the site
        run: |
          bash scripts/build-docs.sh .build/site 2>&1 | tail -20
          ls .build/site/documentation
          # DocC's file names have colons, which artifacts don't take: the site goes up as a tarball (Pages takes one too).
          tar -C .build -czf site.tar.gz site
      - uses: actions/upload-artifact@v4
        with: { name: site, path: notes/site.tar.gz, retention-days: 7 }
