# Not for upstream: the swift-notes package (notes/) tested on x86 runners, with its X86Extensions trait and without.
name: x86 notes
on:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
    working-directory: notes

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Swift 6.4.2
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils git libc6-dev libcurl4-openssl-dev libedit2 libgcc-13-dev libncurses-dev \
            libsqlite3-0 libstdc++-13-dev libxml2-dev libz3-dev pkg-config tzdata unzip zlib1g-dev
          sudo mkdir -p /opt/swift
          curl -fsSL https://download.swift.org/swift-6.4.2-release/ubuntu2404/swift-6.4.2-RELEASE/swift-6.4.2-RELEASE-ubuntu24.04.tar.gz \
            | sudo tar -C /opt/swift -xz --strip-components=1 --exclude='usr/bin/lldb*' --exclude='usr/lib/liblldb*' \
              --exclude='usr/bin/sourcekit-lsp' --exclude='usr/lib/libsourcekitdInProc.so' --exclude='usr/bin/docc'
          echo /opt/swift/usr/bin >> "$GITHUB_PATH"
      - name: the CPU
        run: |
          lscpu | grep -E 'Model name'
          echo "features: $(grep -o -w -E 'sha_ni|pclmulqdq|avx512f|vpclmulqdq' /proc/cpuinfo | sort -u | xargs)"
      - name: test (debug)
        run: swift test 2>&1 | grep -E '✘|passed after|failed|error|runs on|on extensions' | tail -24
      - name: test (release), and which paths ran
        run: |
          swift test -c release -Xswiftc -enable-testing 2>&1 | grep -E '✘|passed after|failed|error|runs on|on extensions' | tail -24
      - name: test (portable only)
        run: swift test --disable-default-traits 2>&1 | grep -E '✘|passed after|failed|error|runs on|on extensions' | tail -24
