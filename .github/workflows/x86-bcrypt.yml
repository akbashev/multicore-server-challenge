# Not for upstream: the swift-notes package (notes/) tested on x86 runners, with its X86Extensions trait and without.
name: x86 notes
on:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
    working-directory: notes

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            tarball: ubuntu2404/swift-6.4.2-RELEASE/swift-6.4.2-RELEASE-ubuntu24.04.tar.gz
          - runner: ubuntu-24.04-arm
            tarball: ubuntu2404-aarch64/swift-6.4.2-RELEASE/swift-6.4.2-RELEASE-ubuntu24.04-aarch64.tar.gz
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Swift 6.4.2
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils git libc6-dev libcurl4-openssl-dev libedit2 libgcc-13-dev libncurses-dev \
            libsqlite3-0 libstdc++-13-dev libxml2-dev libz3-dev pkg-config tzdata unzip zlib1g-dev
          sudo mkdir -p /opt/swift
          curl -fsSL "https://download.swift.org/swift-6.4.2-release/${{ matrix.tarball }}" \
            | sudo tar -C /opt/swift -xz --strip-components=1 --exclude='usr/bin/lldb*' --exclude='usr/lib/liblldb*' \
              --exclude='usr/bin/sourcekit-lsp' --exclude='usr/lib/libsourcekitdInProc.so' --exclude='usr/bin/docc'
          echo /opt/swift/usr/bin >> "$GITHUB_PATH"
      - name: the CPU
        run: |
          uname -r; lscpu | grep -E 'Model name'
          echo "features: $(grep -o -w -E 'sha_ni|pclmulqdq|avx512f|vpclmulqdq' /proc/cpuinfo | sort -u | xargs)"
      - name: release, one target at a time (each under 120 s)
        timeout-minutes: 20
        run: |
          set +e
          swift build -c release -Xswiftc -enable-testing --build-tests 2>&1 | grep -E 'error|Build' | tail -2
          for t in SHA256Tests CRC32Tests GzipTests BcryptTests IORingTests EventLoopTests; do
            timeout 120 swift test -c release -Xswiftc -enable-testing --skip-build --filter "$t" > /tmp/out.txt 2>&1
            echo "TARGET $t: exit $? ($(grep -o 'Test run with [0-9]* tests' /tmp/out.txt | head -1))"
          done
      - name: each EventLoop test alone in release, ten times
        timeout-minutes: 25
        run: |
          set +e
          for name in actorsRunOnTheLoopsThread interruptEndsAWaitBeforeOrDuring waitLastsUntilItsDeadline registeredDescriptorsWakeTheLoop messagesWakeWaitForEvents; do
            ok=0; hung=0; other=0
            for i in $(seq 10); do
              timeout 30 swift test -c release -Xswiftc -enable-testing --skip-build --filter "EventLoopTests.$name" > /tmp/out.txt 2>&1
              case $? in 0) ok=$((ok + 1)) ;; 124) hung=$((hung + 1)) ;; *) other=$((other + 1)); tail -5 /tmp/out.txt ;; esac
            done
            echo "RESULT release $name: $ok passed, $hung hung, $other failed"
          done
