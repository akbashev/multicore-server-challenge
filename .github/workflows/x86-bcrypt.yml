# Not for upstream: the swift-notes package (notes/) tested on x86 runners, with its X86Extensions trait and without.
name: x86 notes
on:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
    working-directory: notes

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            tarball: ubuntu2404/swift-6.4.2-RELEASE/swift-6.4.2-RELEASE-ubuntu24.04.tar.gz
          - runner: ubuntu-24.04-arm
            tarball: ubuntu2404-aarch64/swift-6.4.2-RELEASE/swift-6.4.2-RELEASE-ubuntu24.04-aarch64.tar.gz
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Swift 6.4.2
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils git libc6-dev libcurl4-openssl-dev libedit2 libgcc-13-dev libncurses-dev \
            libsqlite3-0 libstdc++-13-dev libxml2-dev libz3-dev pkg-config tzdata unzip zlib1g-dev
          sudo mkdir -p /opt/swift
          curl -fsSL "https://download.swift.org/swift-6.4.2-release/${{ matrix.tarball }}" \
            | sudo tar -C /opt/swift -xz --strip-components=1 --exclude='usr/bin/lldb*' --exclude='usr/lib/liblldb*' \
              --exclude='usr/bin/sourcekit-lsp' --exclude='usr/lib/libsourcekitdInProc.so' --exclude='usr/bin/docc'
          echo /opt/swift/usr/bin >> "$GITHUB_PATH"
      - name: the CPU
        run: |
          uname -r; lscpu | grep -E 'Model name'
          echo "features: $(grep -o -w -E 'sha_ni|pclmulqdq|avx512f|vpclmulqdq' /proc/cpuinfo | sort -u | xargs)"
      - name: test (debug), one target at a time
        timeout-minutes: 40
        run: |
          swift build --build-tests 2>&1 | grep -E 'error|Compiling|Build' | tail -3
          for t in SHA256Tests CRC32Tests GzipTests BcryptTests EventLoopTests IORingTests; do
            echo "== $t"
            timeout 300 swift test --skip-build --filter "$t" 2>&1 \
              | grep --line-buffered -E 'started|passed|failed|✘|error:|Expectation|runs on|on extensions|recorded' \
              || echo "!! $t ended with ${PIPESTATUS[0]} (124: killed after 300 s)"
          done
      - name: test (release), one target at a time
        timeout-minutes: 40
        run: |
          swift build -c release -Xswiftc -enable-testing --build-tests 2>&1 | grep -E 'error|Build' | tail -3
          for t in EventLoopTests IORingTests SHA256Tests CRC32Tests; do
            echo "== $t"
            timeout 300 swift test -c release -Xswiftc -enable-testing --skip-build --filter "$t" 2>&1 \
              | grep --line-buffered -E 'started|passed|failed|✘|error:|Expectation|runs on|on extensions|recorded' \
              || echo "!! $t ended with ${PIPESTATUS[0]} (124: killed after 300 s)"
          done
